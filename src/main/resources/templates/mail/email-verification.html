<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이메일 인증번호 안내</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 30px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
    <h2 style="color: #4CAF50;">안녕하세요! ECHAD 본인인증입니다.</h2>
    <p>회원가입을 위해 아래의 인증번호를 입력해 주세요.</p>
    <div style="background-color: #f9f9f9; padding: 15px; text-align: center; border-radius: 5px; margin: 20px 0;">
        <span style="font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #333;" th:text="${verificationCode}">123456</span>
    </div>
    <p>해당 인증번호는 <strong>3분 동안</strong> 유효합니다.</p>
    <p>만약 본인이 요청하지 않으셨다면 이 메일을 무시해 주세요.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="font-size: 12px; color: #999;">본 메일은 발신 전용 메일입니다. 문의사항은 고객센터를 이용해 주세요.</p>
</div>
</body>
</html>
